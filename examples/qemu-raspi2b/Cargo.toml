[package]
edition = "2024"
name = "embassy-qemu-raspi2b-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aarch32-cpu = { version = "0.4.0", features = ["critical-section-single-core", "defmt"] }
aarch32-rt = "0.5.0"
critical-section = "1.2.0"
defmt = "1.0.1"
defmt-semihosting = "0.3"
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-aarch32", "executor-thread", "defmt"] }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync", features = ["defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "tick-hz-1_000_000"] }
embassy-time-driver = { version = "0.2.2", path = "../../embassy-time-driver" }
embassy-time-queue-utils = { version = "0.3.2", path = "../../embassy-time-queue-utils" }
embassy-usb = { version = "0.6.0", path = "../../embassy-usb", default-features = false, features = ["defmt"] }
embassy-usb-driver = { version = "0.2.2", path = "../../embassy-usb-driver", features = ["defmt"] }
embassy-usb-synopsys-otg = { version = "0.4.0", path = "../../embassy-usb-synopsys-otg", features = ["defmt"] }
semihosting = "0.1.25"

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "armv7a-none-eabi", artifact-dir = "out/examples/qemu-raspi2b" }
]
